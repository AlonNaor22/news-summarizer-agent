[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "news-summarizer-agent"
version = "1.0.0"
description = "AI-powered news aggregator with summarization, sentiment analysis, trending topics, and Q&A using Claude AI."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
    "langchain>=0.3.0,<0.4.0",
    "langchain-anthropic>=0.3.0,<0.4.0",
    "anthropic>=0.40.0",
    "feedparser>=6.0.10",
    "requests>=2.31.0",
    "beautifulsoup4>=4.12.0",
    "python-dotenv>=1.0.0",
    "python-dateutil>=2.8.0",
    "tenacity>=8.2.0",
]

[project.optional-dependencies]
backend = [
    "fastapi==0.109.0",
    "uvicorn==0.27.0",
    "python-multipart==0.0.6",
]
dev = [
    "pytest>=7.0.0",
]

[project.scripts]
news-summarizer = "main:main"

[tool.setuptools]
# Top-level modules importable from the project root
py-modules = ["main", "config"]

[tool.setuptools.packages.find]
# Treat src/ and backend/ as Python packages
include = ["src*", "backend*"]
exclude = ["tests*", "frontend*", "venv*", "output*", "cache*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"
