# Render Blueprint — deploys backend (Docker) and frontend (static site).
# Usage: connect this repo to Render, then set the required env vars in the
# Render dashboard before the first deploy.
#
# Required secrets (set in Render dashboard → Environment):
#   Backend:  ANTHROPIC_API_KEY, NEWS_API_KEY (optional), FRONTEND_URL
#   Frontend: VITE_API_URL  (set to your backend's Render URL, e.g.
#                             https://news-summarizer-backend.onrender.com)
#
# Deploy button: https://render.com/deploy?repo=https://github.com/AlonNaor22/news-summarizer-agent

services:
  # ── Backend: FastAPI served by uvicorn inside a Docker container ────────────
  - type: web
    name: news-summarizer-backend
    env: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /api/health
    envVars:
      # Set these in the Render dashboard — never commit real values here.
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: NEWS_API_KEY
        sync: false
      # Set to your Render frontend URL so CORS allows it.
      # Example: https://news-summarizer-frontend.onrender.com
      - key: FRONTEND_URL
        sync: false

  # ── Frontend: Vite bundle served as a static site ───────────────────────────
  - type: web
    name: news-summarizer-frontend
    env: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      # Set to the deployed backend URL before the frontend build runs.
      # Example: https://news-summarizer-backend.onrender.com/api
      - key: VITE_API_URL
        sync: false
    routes:
      # SPA fallback — all paths hand off to index.html for react-router.
      - type: rewrite
        source: /*
        destination: /index.html
